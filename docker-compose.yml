services:
  ordersmicroservice.api:
    image: ordersmicroserviceapi
    build:
      context: .
      dockerfile: OrdersMicroService.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MONGODB_HOST=mongodb-container
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=OrdersDatabase 
      - UsersMicroserviceName=users-microservice-container
      - UsersMicroservicePort=9090
      - ProductsMicroserviceName=products-microservice-container
      - ProductsMicroservicePort=8080 
    ports:
      - "7000:8080"
    networks:
      - orders-mongodb-network
      - ecommerce-network 
    depends_on:
      - mongodb-container
  

  mongodb-container:
    image: mongo:latest
    ports:
       - "27017:27017"
    volumes:
       - C:/Users/USER/OneDrive/Desktop/eCommerce/mongo-init:/docker-entrypoint-initdb.d
    networks:
       - orders-mongodb-network


  mysql-container:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - C:/Users/USER/OneDrive/Desktop/eCommerce/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - products-mysql-network


  products-microservice-container:
    image: products-microservice:latest
    ports:
      - "6000:8080"
    networks:
      - products-mysql-network
      - ecommerce-network 
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - MYSQL_HOST=mysql-container
      - MYSQL_PASSWORD=admin
      - MYSQL_DATABASE=ecommerceproductsdatabase
      - MYSQL_PORT=3306
      - MYSQL_USER=root 
    depends_on:
      - mysql-container



  postgres-container:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eCommerceUsers
    ports:
      - "5433:5432"
    volumes:
      - C:/Users/USER/OneDrive/Desktop/eCommerce/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - users-postgres-network
  
  users-microservice-container:
    image: users-microservice:latest
    ports:
      - "5000:9090"
    networks:
      - users-postgres-network
      - ecommerce-network 
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - POSTGRES_HOST=postgres-container
      - POSTGRES_PASSWORD=admin 
      - POSTGRES_DATABASE=eCommerceUsers
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres 
    depends_on:
      - postgres-container

networks:
  orders-mongodb-network:
    driver: bridge
  products-mysql-network:
    driver: bridge
  users-postgres-network:
    driver: bridge
  ecommerce-network:
    driver: bridge

